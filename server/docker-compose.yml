services:
  auth-service:
    build: ./auth_service
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  data-service:
    build: ./data_service
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  analysis-service:
    build: ./analysis_service
    ports:
      - "5003:5003"
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
    networks:
      - backend

  earth-engine-service:
    build: ./earth_engine_service
    ports:
      - "5004:5004"
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gee-key.json
    volumes:
      - ${GEE_KEY_PATH}:/run/secrets/gee-key.json:ro
    networks:
      - backend

  file-service:
    build: ./file_service
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      FLASK_APP: app.py
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biolivar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-biolivar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data: